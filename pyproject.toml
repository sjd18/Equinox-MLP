[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eqxmlp"
version = "0.1.0"
description = "Learn a potential energy with an Equinox MLP, then integrate its autodiff forces with velocity Verlet under lax.scan."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11.4",
    "jaxtyping>=0.2.28",
    "optax>=0.2",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.8", "jupyter"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/eqxmlp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# F722: jaxtyping shape strings; B008: Equinox modules are immutable, safe as defaults.
ignore = ["E741", "F722", "B008"]

[tool.ruff.lint.per-file-ignores]
# Notebooks enable float64 via jax.config before importing the rest.
"*.ipynb" = ["E402"]
